<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="SwaggerUI" />
    <title>SwaggerUI</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/Itz-fork/Fastapi-Swagger-UI-Dark@868ea5da89b4e7d9aa7fe57f601485d68f26695d/assets/swagger_ui_dark.min.css"
      media="(prefers-color-scheme: dark)"
      crossorigin="anonymous"
      integrity="sha384-uFFUYDzMQNCAsNQHyjX9WExpaDBrtT+3F/7yo37l/lUEsOa7yAUqDFRlDEG2u8RY"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css"
      media="(prefers-color-scheme: light)"
      crossorigin="anonymous"
      integrity="sha384-+yyzNgM3K92sROwsXxYCxaiLWxWJ0G+v/9A+qIZ2rgefKgkdcmJI+L601cqPD/Ut"
    />
    <style>
      @media (prefers-color-scheme: dark) {
        .swagger-ui textarea {
          background: hsl(358.8deg 1.05% 1.91% / 80%) !important;
        }
        .swagger-ui .scheme-container {
          background: #1e1e2e;
        }
        .swagger-ui select {
          background: rgba(0, 0, 0, 0.2);
        }
        .opblock-control-arrow {
          background: black;
        }
        .opblock-tag {
          border-bottom: 1px solid #96ccff;
        }
        .swagger-ui .opblock .opblock-summary-path {
          display: inline;
        }
        .models-control {
          color: whitesmoke !important;
        }
        .model-title {
          color: ghostwhite !important;
        }
      }
    </style>
  </head>

  <body>
    <div id="swagger-ui"></div>
    <script
      src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"
      crossorigin="anonymous"
      integrity="sha384-qn5tagrAjZi8cSmvZ+k3zk4+eDEEUcP9myuR2J6V+/H6rne++v6ChO7EeHAEzqxQ"
    ></script>
    <script>
      window.onload = () => {
        window.ui = SwaggerUIBundle(__SWAGGER_UI_OPTIONS__);
      };
    </script>
  </body>
</html>
